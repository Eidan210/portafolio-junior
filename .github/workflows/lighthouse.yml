# Mide el build con Lighthouse (perfil móvil, mediana de 3 corridas) en cada
# push a main y en cada pull request, con los umbrales de .lighthouserc.json.
# Accesibilidad, buenas prácticas, SEO (95) y CLS (0,1) son deterministas y
# bloquean. El rendimiento (80, medido 87–90 en local) solo avisa: en los
# runners compartidos de GitHub varió de 62 a 78 en una misma corrida y como
# bloqueo daría falsos rojos. Los informes quedan como artefacto del workflow.
name: Lighthouse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npx --yes @lhci/cli@0.15.1 autorun

      - name: Guardar informes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse
          path: lhci
          if-no-files-found: ignore
