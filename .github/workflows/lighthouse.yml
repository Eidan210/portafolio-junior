# Mide el build con Lighthouse (perfil móvil, mediana de 3 corridas) en cada
# push a main y en cada pull request, y falla si los puntajes bajan de los
# umbrales de .lighthouserc.json. Calibrados el 2026-10-14 sobre el build real:
# rendimiento 87–90, accesibilidad 100, buenas prácticas 100 y SEO 100; los
# umbrales (80/95/95/95) dejan margen al ruido entre máquinas sin tapar una
# regresión. Los informes quedan como artefacto del workflow.
name: Lighthouse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npx --yes @lhci/cli@0.15.1 autorun

      - name: Guardar informes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse
          path: lhci
          if-no-files-found: ignore
